# yaml-language-server: $schema=http://schemas.home-assistant.io/configuration
###########################################################################################################
# House Battery Control — "Charge Deadline" add-on function
#
# Charge the batteries to a target State of Charge before a deadline.
# PV surplus is used first (Nul-op-de-Meter); any shortfall is topped up from the grid.
# Peak shaving keeps functioning (the Self-consumption PID and the import limit stay in charge).
#
# Install: drop this file in your `packages/` folder (same place as house_battery_control.yaml).
#
# Activation is adding one option to your existing strategy selectors:
#   input_select.house_battery_strategy:
#     options:
#       - ...
#       - Charge Deadline      # <-- add this line
#
# WHERE the charge window comes from is not set here. It follows the strategy that
# dispatches Charge Deadline - see sensor.deadline_pacing below:
#   Dynamic + 'Strategy during cheapest period' = Charge Deadline -> Cheapest hours
#   Timed   + any period strategy               = Charge Deadline -> Time slot
#   Charge Deadline as the master strategy                        -> Manual window
#
# house_battery_control.yaml is touched too: the strategy option in the selectors, and
# two recorder exclusions for the sensors here that re-render every minute.
###########################################################################################################

###########################################################################################################
# DATETIME — begin & end of the charge window (time of day)
###########################################################################################################
input_datetime:
  house_battery_deadline_start:
    name: Charge Deadline start
    has_date: false
    has_time: true
    icon: mdi:clock-start

  house_battery_deadline_end:
    name: Charge Deadline end
    has_date: false
    has_time: true
    icon: mdi:clock-end

###########################################################################################################
# INPUT_NUMBER — target + analytics (analytics values are written by Node-RED)
###########################################################################################################
input_number:
  # Target State of Charge to reach before the deadline (used when goal = "state of charge")
  house_battery_deadline_target_soc:
    name: Deadline target SoC
    min: 15
    max: 100
    initial: 100
    step: 1
    unit_of_measurement: "%"
    mode: box
    icon: mdi:battery-charging-high

  # Target energy reserve to reach before the deadline (used when goal = "energy reserve")
  house_battery_deadline_target_energy:
    name: Deadline target energy
    min: 0
    max: 100
    initial: 0
    step: 0.1
    unit_of_measurement: "kWh"
    mode: box
    icon: mdi:battery-charging

  # Output: average charge power required to hit the target in time
  house_battery_deadline_required_power:
    name: Deadline required average power
    min: 0
    max: 25000
    initial: 0
    step: 1
    unit_of_measurement: "W"
    mode: box
    icon: mdi:flash

  # Output: ACTUAL charge power currently coming from the grid
  house_battery_deadline_grid_power:
    name: Deadline grid share
    min: 0
    max: 25000
    initial: 0
    step: 1
    unit_of_measurement: "W"
    mode: box
    icon: mdi:transmission-tower-import

  # Output: how far the ACTUAL charge power falls below the required average power,
  # but ONLY while a limit is actually binding - grid import at the peak-shaving
  # threshold, or the packs at their combined charge limit. Below the threshold
  # there is headroom, the gap is just the PID ramping, and this reads 0.
  house_battery_deadline_shortage_power:
    name: Deadline shortage
    min: 0
    max: 25000
    initial: 0
    step: 1
    unit_of_measurement: "W"
    mode: box
    icon: mdi:alert-outline

  # Output: ACTUAL charge power currently coming from PV surplus
  house_battery_deadline_pv_power:
    name: Deadline PV share
    min: 0
    max: 25000
    initial: 0
    step: 1
    unit_of_measurement: "W"
    mode: box
    icon: mdi:solar-power

  # Output: energy still needed to reach the target SoC
  house_battery_deadline_remaining_energy:
    name: Deadline remaining energy
    min: 0
    max: 1000
    initial: 0
    step: 0.01
    unit_of_measurement: "kWh"
    mode: box
    icon: mdi:battery-clock

  # Output: minutes left until the deadline
  house_battery_deadline_remaining_minutes:
    name: Deadline remaining minutes
    min: 0
    max: 1440
    initial: 0
    step: 1
    unit_of_measurement: "min"
    mode: box
    icon: mdi:timer-sand

###########################################################################################################
# INPUT_BOOLEAN — behaviour switches
###########################################################################################################
input_boolean:
  # Keep the batteries at the target once it is reached, instead of handing straight
  # back to the fallback strategy. ON is what makes "be full for the night" mean
  # anything: without it the fallback discharges the reserve the moment it is built,
  # the target drops below tolerance again and the flow re-buys the same energy - a
  # charge/discharge ping-pong that runs for the rest of the window.
  # OFF restores the old behaviour (fallback takes over immediately).
  house_battery_deadline_hold_after_target:
    name: Deadline hold target until deadline
    icon: mdi:lock-check-outline
    initial: true

  # Subtract the PV still forecast for the rest of today from the energy that has to
  # come from the grid, so a sunny afternoon is not pre-empted by grid charging in
  # the morning. Uses sensor.solar_forecast_surplus_today (forecast minus the house
  # reserve) from house_battery_control.yaml. OFF = ignore the forecast (default:
  # the plan then only reacts to PV it can actually measure).
  house_battery_deadline_reserve_pv:
    name: Deadline reserve forecast PV
    icon: mdi:weather-sunny
    initial: false

###########################################################################################################
# INPUT_SELECT — goal, and what to do once the target is reached
###########################################################################################################
input_select:
  # Choose whether the target is expressed as a State of Charge (%), an energy reserve (kWh),
  # or simply "as full as possible".
  #   state of charge    -> input_number.house_battery_deadline_target_soc
  #   energy reserve     -> input_number.house_battery_deadline_target_energy
  #   batteries are full -> fixed 100 % SoC, no target helper needed
  house_battery_deadline_goal:
    name: Charge Deadline until
    options:
      - batteries are full
      - state of charge
      - energy reserve
    # 'initial' is applied on EVERY restart, not just the first: HA sets the option
    # at startup instead of restoring the stored one. So this is the value the
    # strategy comes up with after any reload of the helpers.
    initial: batteries are full
    icon: mdi:battery-charging-80

  house_battery_deadline_reached:
    name: Then use
    options:
      - Self-consumption
      - Charge PV
      - Zero import
      - Standby / peak shave
      - Full stop
    initial: Self-consumption
    icon: mdi:checkerboard

###########################################################################################################
# INPUT_TEXT — human readable status (written by Node-RED)
###########################################################################################################
input_text:
  house_battery_deadline_status:
    name: Deadline status
    icon: mdi:information-outline
    max: 255

###########################################################################################################
# TEMPLATE SENSORS
###########################################################################################################
template:
  - sensor:
      # ---------------------------------------------------------------------------------------------
      # Fleet state of charge, energy-weighted across the packs.
      #
      # HBC has no combined-SoC entity of its own, so this package brings one rather than
      # depending on a helper the user happens to have built. Weighting by pack capacity keeps
      # it honest when the packs differ in size; with identical packs it is the plain average,
      # and it falls back to a plain average when the capacity entities are not reporting.
      #
      # A pack that is not reporting is LEFT OUT rather than counted as 0 %, which would drag
      # the fleet figure down and have the strategy buy energy it does not need. With nothing
      # reporting at all the state is `unknown`, so everything downstream degrades through
      # has_value() instead of quietly planning against a made-up 0 %.
      #
      # Adjust the range below if you have a different number of batteries.
      # ---------------------------------------------------------------------------------------------
      - name: "HBC battery fleet SoC"
        unique_id: hbc_battery_fleet_soc
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        icon: mdi:battery-heart-variant
        state: >-
          {%- set ns = namespace(cap=0, weighted=0, count=0, plain=0) -%}
          {%- for i in range(1, 7) -%}
            {%- set soc = states('sensor.marstek_m' ~ i ~ '_battery_state_of_charge') -%}
            {%- set cap = states('sensor.marstek_m' ~ i ~ '_battery_total_energy') -%}
            {%- if is_number(soc) -%}
              {%- set c = cap | float(0) if is_number(cap) else 0 -%}
              {%- set ns.count = ns.count + 1 -%}
              {%- set ns.plain = ns.plain + (soc | float(0)) -%}
              {%- set ns.cap = ns.cap + c -%}
              {%- set ns.weighted = ns.weighted + (soc | float(0)) * c -%}
            {%- endif -%}
          {%- endfor -%}
          {%- if ns.cap > 0 -%}
            {{ (ns.weighted / ns.cap) | round(1) }}
          {%- elif ns.count > 0 -%}
            {{ (ns.plain / ns.count) | round(1) }}
          {%- else -%}
            unknown
          {%- endif -%}
        attributes:
          # How many packs are actually contributing, so a silent battery is visible.
          packs_reporting: >-
            {%- set ns = namespace(n=0) -%}
            {%- for i in range(1, 7) -%}
              {%- if is_number(states('sensor.marstek_m' ~ i ~ '_battery_state_of_charge')) -%}
                {%- set ns.n = ns.n + 1 -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.n }}

      # ---------------------------------------------------------------------------------------------
      # Every period marked cheap that is still ahead of us TODAY, as merged runs.
      #
      # Split out from the window sensor because with "Cheapest hours" the window is DERIVED
      # from these blocks - the two cannot be computed in one sensor without one deriving the
      # other twice. Adjacent price intervals are glued into runs, price becomes the
      # minute-weighted average over the run, tomorrow is dropped before gluing so a run can
      # never grow past midnight, and a run already underway is clipped to start at 'now'.
      #
      # State = total minutes. Attribute `blocks` = [{start, end, price, minutes}], time order.
      # ---------------------------------------------------------------------------------------------
      - name: "Deadline cheap blocks"
        unique_id: house_battery_deadline_cheap_blocks
        unit_of_measurement: "min"
        icon: mdi:cash-clock
        # The state must NOT read this sensor's own `blocks` attribute: a template entity
        # renders its state against the PREVIOUS attributes, so it would report the total from
        # one render ago and create a self-dependency. Summing the raw intervals gives the
        # identical number - merging changes how the minutes are grouped, never how many.
        state: >-
          {%- set now_ts = as_timestamp(now()) -%}
          {%- set today = now().strftime('%Y-%m-%d') -%}
          {%- set eod = as_timestamp(today_at('23:59:59')) -%}
          {%- set ns = namespace(total=0) -%}
          {%- for iv in (state_attr('sensor.hbc_energy_prices_data', 'marks') or [])
                | selectattr('mark', 'eq', 'low') | list -%}
            {%- if as_timestamp(iv.start, 0) > 0 and as_timestamp(iv.end, 0) > as_timestamp(iv.start, 0)
                   and (as_timestamp(iv.start, 0) | timestamp_custom('%Y-%m-%d', true)) == today -%}
              {%- set bs = [as_timestamp(iv.start, 0), now_ts] | max -%}
              {%- set be = [as_timestamp(iv.end, 0), eod] | min -%}
              {%- if be > bs -%}{%- set ns.total = ns.total + (be - bs) -%}{%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ (ns.total / 60) | round(0) | int }}
        attributes:
          blocks: >-
            {%- set now_ts = as_timestamp(now()) -%}
            {%- set today = now().strftime('%Y-%m-%d') -%}
            {%- set eod = as_timestamp(today_at('23:59:59')) -%}
            {#- Reject entries with no start/end BEFORE sorting: sort(attribute='start')
                raises on a null and that would take the whole attribute down with it,
                leaving the strategy with no blocks at all. -#}
            {%- set lows = (state_attr('sensor.hbc_energy_prices_data', 'marks') or [])
                  | selectattr('mark', 'eq', 'low')
                  | selectattr('start', 'defined') | rejectattr('start', 'none')
                  | selectattr('end', 'defined') | rejectattr('end', 'none')
                  | sort(attribute='start') | list -%}
            {%- set ns = namespace(runs=[], out=[], cs=none, ce=none, psum=0, pmin=0) -%}
            {%- for iv in lows -%}
              {#- Skip anything without a usable start/end rather than letting a bad entry
                  poison the whole run: as_timestamp() would yield 0 and glue nonsense on. -#}
              {%- if as_timestamp(iv.start, 0) > 0 and as_timestamp(iv.end, 0) > as_timestamp(iv.start, 0)
                     and (as_timestamp(iv.start, 0) | timestamp_custom('%Y-%m-%d', true)) == today -%}
                {%- set m = (as_timestamp(iv.end, 0) - as_timestamp(iv.start, 0)) / 60 -%}
                {%- if ns.cs is not none and iv.start == ns.ce -%}
                  {%- set ns.ce = iv.end -%}
                  {%- set ns.psum = ns.psum + (iv.price | float(0)) * m -%}
                  {%- set ns.pmin = ns.pmin + m -%}
                {%- else -%}
                  {%- if ns.cs is not none -%}
                    {%- set ns.runs = ns.runs + [{'s': ns.cs, 'e': ns.ce, 'p': ns.psum / ns.pmin}] -%}
                  {%- endif -%}
                  {%- set ns.cs = iv.start -%}{%- set ns.ce = iv.end -%}
                  {%- set ns.psum = (iv.price | float(0)) * m -%}{%- set ns.pmin = m -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {%- if ns.cs is not none -%}
              {%- set ns.runs = ns.runs + [{'s': ns.cs, 'e': ns.ce, 'p': ns.psum / ns.pmin}] -%}
            {%- endif -%}
            {%- for r in ns.runs -%}
              {%- set bs = [as_timestamp(r.s, 0), now_ts] | max -%}
              {%- set be = [as_timestamp(r.e, 0), eod] | min -%}
              {%- if be > bs -%}
                {%- set ns.out = ns.out + [{
                      'start': bs | timestamp_custom('%H:%M:%S', true),
                      'end': be | timestamp_custom('%H:%M:%S', true),
                      'price': r.p | round(2),
                      'minutes': ((be - bs) / 60) | round(0) | int }] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.out }}

      # ---------------------------------------------------------------------------------------------
      # WHICH pacing is in force. There is no pacing choice to make any more: the strategy
      # that dispatches Charge Deadline decides where the window comes from.
      #
      #   Dynamic + 'Strategy during cheapest period' = Charge Deadline -> Cheapest hours
      #   Timed   + any period strategy               = Charge Deadline -> Time slot
      #   anything else (Charge Deadline as the master strategy)        -> Manual window
      #
      # 'Cheapest hours' is spelled exactly as the Node-RED flow expects it: Compute plan
      # branches on wAttr.pacing === "Cheapest hours" to pace the energy across the cheap
      # blocks. Every other value means "spread evenly across the window", which is what a
      # time slot and a manual window both want - so the flow needs no change.
      #
      # Under Timed the gaps between slots are not our problem: the Timed strategy only
      # dispatches Charge Deadline while one of its own periods is running, so nothing
      # charges outside them even though the window spans from the first to the last.
      #
      # Attributes:
      #   slots        merged Charge Deadline periods of the Timed strategy ([] otherwise)
      #   clamped      true when a Timed period ending at or before its start was cut to 23:59:59
      #   source       where the window is read from, in words - names the Timed periods
      # ---------------------------------------------------------------------------------------------
      - name: "Deadline pacing"
        unique_id: house_battery_deadline_pacing
        icon: mdi:clock-edit-outline
        state: >-
          {%- set strategy = states('input_select.house_battery_strategy') -%}
          {%- set periods = ['0', 'a'] +
                (['b'] if is_state('input_boolean.house_battery_strategy_timed_has_period_b', 'on') else []) +
                (['c'] if is_state('input_boolean.house_battery_strategy_timed_has_period_c', 'on') else []) +
                (['d'] if is_state('input_boolean.house_battery_strategy_timed_has_period_d', 'on') else []) +
                (['e'] if is_state('input_boolean.house_battery_strategy_timed_has_period_e', 'on') else []) -%}
          {%- set ns = namespace(timed=false) -%}
          {%- for p in periods -%}
            {%- if states('input_select.house_battery_strategy_timed_strat_' ~ p) == 'Charge Deadline' -%}
              {%- set ns.timed = true -%}
            {%- endif -%}
          {%- endfor -%}
          {%- if strategy == 'Dynamic'
                 and states('input_select.house_battery_strategy_dynamic_cheapest') == 'Charge Deadline' -%}
            Cheapest hours
          {%- elif strategy == 'Timed' and ns.timed -%}
            Time slot
          {%- else -%}
            Manual window
          {%- endif -%}
        attributes:
          # Where the window is being read from, in words - the first thing to look at when
          # the window is not what you expected. Under Timed it names the periods, so you can
          # see at a glance which of A-E the times are coming from.
          source: >-
            {%- set strategy = states('input_select.house_battery_strategy') -%}
            {%- if strategy == 'Dynamic'
                   and states('input_select.house_battery_strategy_dynamic_cheapest') == 'Charge Deadline' -%}
              sensor.deadline_cheap_blocks
            {%- elif strategy == 'Timed' -%}
              {%- set periods = ['0', 'a'] +
                    (['b'] if is_state('input_boolean.house_battery_strategy_timed_has_period_b', 'on') else []) +
                    (['c'] if is_state('input_boolean.house_battery_strategy_timed_has_period_c', 'on') else []) +
                    (['d'] if is_state('input_boolean.house_battery_strategy_timed_has_period_d', 'on') else []) +
                    (['e'] if is_state('input_boolean.house_battery_strategy_timed_has_period_e', 'on') else []) -%}
              {%- set ns = namespace(out=[]) -%}
              {%- for p in periods -%}
                {%- if states('input_select.house_battery_strategy_timed_strat_' ~ p) == 'Charge Deadline' -%}
                  {%- set ns.out = ns.out + [('baseline' if p == '0' else 'period ' ~ (p | upper))] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ 'Timed ' ~ (ns.out | join(', ')) if ns.out | count > 0 else 'Timed - no period set to Charge Deadline' }}
            {%- else -%}
              input_datetime.house_battery_deadline_start / _end
            {%- endif -%}
          # The Timed periods whose strategy is Charge Deadline, merged into runs.
          # Each period is clamped to the current day the same way a manual window is:
          # an end at or before its start would run into tomorrow, so it becomes 23:59:59.
          # Periods that touch or overlap are merged, so two back-to-back slots read as
          # one. The baseline strategy has no times of its own and so covers the whole day.
          slots: >-
            {%- set periods = ['0', 'a'] +
                  (['b'] if is_state('input_boolean.house_battery_strategy_timed_has_period_b', 'on') else []) +
                  (['c'] if is_state('input_boolean.house_battery_strategy_timed_has_period_c', 'on') else []) +
                  (['d'] if is_state('input_boolean.house_battery_strategy_timed_has_period_d', 'on') else []) +
                  (['e'] if is_state('input_boolean.house_battery_strategy_timed_has_period_e', 'on') else []) -%}
            {%- set bad = ['unknown', 'unavailable', 'none', ''] -%}
            {%- set ns = namespace(raw=[], out=[], cs=none, ce=none, names=[]) -%}
            {%- for p in periods -%}
              {%- if states('input_select.house_battery_strategy_timed_strat_' ~ p) == 'Charge Deadline' -%}
                {%- if p == '0' -%}
                  {%- set ns.raw = ns.raw + [{'start': '00:00:00', 'end': '23:59:59', 'name': 'Baseline'}] -%}
                {%- else -%}
                  {%- set s = states('input_datetime.house_battery_strategy_timed_period_' ~ p ~ '1') -%}
                  {%- set e = states('input_datetime.house_battery_strategy_timed_period_' ~ p ~ '2') -%}
                  {#- Reject anything that is not a clock: one bad entry must not skew the
                      window, and a start equal to its end is an empty period, not a day. -#}
                  {%- if s not in bad and e not in bad and s != e
                         and s is match('^\\d{2}:\\d{2}:\\d{2}$') and e is match('^\\d{2}:\\d{2}:\\d{2}$') -%}
                    {%- set ns.raw = ns.raw + [{
                          'start': s,
                          'end': ('23:59:59' if e < s else e),
                          'name': p | upper }] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {%- for r in ns.raw | sort(attribute='start') -%}
              {%- if ns.cs is not none and r.start <= ns.ce -%}
                {%- set ns.ce = [ns.ce, r.end] | max -%}
                {%- set ns.names = ns.names + [r.name] -%}
              {%- else -%}
                {%- if ns.cs is not none -%}
                  {%- set ns.out = ns.out + [{
                        'start': ns.cs, 'end': ns.ce,
                        'minutes': ((as_timestamp(today_at(ns.ce)) - as_timestamp(today_at(ns.cs))) / 60) | round(0) | int }] -%}
                {%- endif -%}
                {%- set ns.cs = r.start -%}{%- set ns.ce = r.end -%}
                {%- set ns.names = ns.names + [r.name] -%}
              {%- endif -%}
            {%- endfor -%}
            {%- if ns.cs is not none -%}
              {%- set ns.out = ns.out + [{
                    'start': ns.cs, 'end': ns.ce,
                    'minutes': ((as_timestamp(today_at(ns.ce)) - as_timestamp(today_at(ns.cs))) / 60) | round(0) | int }] -%}
            {%- endif -%}
            {{ ns.out }}
          clamped: >-
            {%- set periods = ['a'] +
                  (['b'] if is_state('input_boolean.house_battery_strategy_timed_has_period_b', 'on') else []) +
                  (['c'] if is_state('input_boolean.house_battery_strategy_timed_has_period_c', 'on') else []) +
                  (['d'] if is_state('input_boolean.house_battery_strategy_timed_has_period_d', 'on') else []) +
                  (['e'] if is_state('input_boolean.house_battery_strategy_timed_has_period_e', 'on') else []) -%}
            {%- set bad = ['unknown', 'unavailable', 'none', ''] -%}
            {%- set ns = namespace(hit=false) -%}
            {%- for p in periods -%}
              {%- if states('input_select.house_battery_strategy_timed_strat_' ~ p) == 'Charge Deadline' -%}
                {%- set s = states('input_datetime.house_battery_strategy_timed_period_' ~ p ~ '1') -%}
                {%- set e = states('input_datetime.house_battery_strategy_timed_period_' ~ p ~ '2') -%}
                {%- if s not in bad and e not in bad and s != e and e < s -%}
                  {%- set ns.hit = true -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.hit }}

      # ---------------------------------------------------------------------------------------------
      # THE window sensor: everything about "when may we charge" in one place, as attributes.
      #
      # Where the window comes from follows sensor.deadline_pacing, which follows the
      # strategy that dispatches Charge Deadline:
      #   Cheapest hours -> the cheap blocks left today: it opens at the first one and closes
      #                     at the end of the last one.
      #   Time slot      -> the Timed strategy's periods that are set to Charge Deadline,
      #                     merged: from the earliest start to the latest end.
      #   Manual window  -> the two input_datetime helpers, clamped to the CURRENT DAY. A
      #                     window whose end is at or before its start would run into
      #                     tomorrow, so the effective end becomes 23:59:59.
      #
      # In every case the window is clamped to the current day - the point of the strategy
      # is to have the batteries full for the night.
      #
      # The state reads "HH:MM - HH:MM (N min)", where N is the wall-clock minutes left to
      # the end of the window; the card shows it as "Charge (cheap hours)" or
      # "Charge (Time slot)" depending on the pacing.
      #
      # Attributes:
      #   pacing        Cheapest hours | Time slot | Manual window
      #   start, end    HH:MM:SS, effective
      #   clamped       true when a window was cut back to 23:59:59
      #   configured    false when there is no usable window at all
      #   in_window     true when now is between start and end
      #   minutes_left  wall-clock minutes from now to the end (0 OUTSIDE the window)
      #                 -- the flow paces on this, so it must stay 0 outside
      #   minutes_to_end  minutes from now to the end, also before the window opens (display)
      #   blocks        the runs the plan may CHARGE IN, always clipped to [now, end] and
      #                 with the finished ones dropped (empty for Manual window). The flow
      #                 paces the energy over the minutes in here, so a run that is half
      #                 over must count as half - see the attribute for the details.
      # ---------------------------------------------------------------------------------------------
      - name: "Deadline window"
        unique_id: house_battery_deadline_window
        icon: mdi:calendar-clock
        state: >-
          {%- set pacing = states('sensor.deadline_pacing') -%}
          {%- set b = (state_attr('sensor.deadline_cheap_blocks', 'blocks') if pacing == 'Cheapest hours'
                       else state_attr('sensor.deadline_pacing', 'slots') if pacing == 'Time slot'
                       else []) or [] -%}
          {%- if pacing in ['Cheapest hours', 'Time slot'] -%}
            {%- if b | count == 0 -%}
              {{ 'No cheap hours left today' if pacing == 'Cheapest hours' else 'No Charge Deadline period set' }}
            {%- else -%}
              {%- set s = (b | first).start -%}
              {%- set e = (b | last).end -%}
              {%- set t = now().strftime('%H:%M:%S') -%}
              {%- if t >= e -%}
                {{ s[:5] }} - {{ e[:5] }} (closed)
              {%- else -%}
                {{ s[:5] }} - {{ e[:5] }} ({{ [((as_timestamp(today_at(e)) - as_timestamp(now())) / 60) | round(0) | int, 0] | max }} min)
              {%- endif -%}
            {%- endif -%}
          {%- else -%}
            {%- set s_raw = states('input_datetime.house_battery_deadline_start') -%}
            {%- set e_raw = states('input_datetime.house_battery_deadline_end') -%}
            {%- if s_raw in ['unknown', 'unavailable', 'none', ''] or e_raw in ['unknown', 'unavailable', 'none', ''] or s_raw == e_raw -%}
              No window set
            {%- else -%}
              {%- set e_eff = '23:59:59' if e_raw < s_raw else e_raw -%}
              {%- set t = now().strftime('%H:%M:%S') -%}
              {%- if t >= e_eff -%}
                {{ s_raw[:5] }} - {{ e_eff[:5] }} (closed)
              {%- else -%}
                {{ s_raw[:5] }} - {{ e_eff[:5] }} ({{ [((as_timestamp(today_at(e_eff)) - as_timestamp(now())) / 60) | round(0) | int, 0] | max }} min)
              {%- endif -%}
            {%- endif -%}
          {%- endif -%}
        attributes:
          pacing: "{{ states('sensor.deadline_pacing') }}"
          # The minutes the plan may actually charge in, NOT a description of the window.
          #
          # Cheap blocks arrive already clipped to [now, end of day], so they pass straight
          # through. The Timed 'slots' do not: they are the configured period times, past
          # ones included. Handing those to the flow makes it pace the remaining energy over
          # minutes that are already gone, which under-charges early and leaves the catch-up
          # to the last period. So they are clipped here, the same way the cheap blocks are:
          # a period already over is dropped, one underway starts at 'now'.
          #
          # HH:MM:SS strings compare correctly as strings, and every slot is on the current
          # day (sensor.deadline_pacing clamps an end at or before its start to 23:59:59),
          # so there is no date arithmetic to get wrong here.
          blocks: >-
            {%- set pacing = states('sensor.deadline_pacing') -%}
            {%- if pacing == 'Cheapest hours' -%}
              {{ state_attr('sensor.deadline_cheap_blocks', 'blocks') or [] }}
            {%- elif pacing == 'Time slot' -%}
              {%- set t = now().strftime('%H:%M:%S') -%}
              {%- set ns = namespace(out=[]) -%}
              {%- for s in (state_attr('sensor.deadline_pacing', 'slots') or []) -%}
                {%- if s.end > t -%}
                  {%- set st = [s.start, t] | max -%}
                  {%- set ns.out = ns.out + [{
                        'start': st,
                        'end': s.end,
                        'minutes': ((as_timestamp(today_at(s.end)) - as_timestamp(today_at(st))) / 60) | round(0) | int }] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
            {%- else -%}
              {{ [] }}
            {%- endif -%}
          configured: >-
            {%- set pacing = states('sensor.deadline_pacing') -%}
            {%- if pacing in ['Cheapest hours', 'Time slot'] -%}
              {{ ((state_attr('sensor.deadline_cheap_blocks', 'blocks') if pacing == 'Cheapest hours'
                   else state_attr('sensor.deadline_pacing', 'slots')) or []) | count > 0 }}
            {%- else -%}
              {%- set s_raw = states('input_datetime.house_battery_deadline_start') -%}
              {%- set e_raw = states('input_datetime.house_battery_deadline_end') -%}
              {{ s_raw not in ['unknown', 'unavailable', 'none', ''] and e_raw not in ['unknown', 'unavailable', 'none', ''] and s_raw != e_raw }}
            {%- endif -%}
          start: >-
            {%- set pacing = states('sensor.deadline_pacing') -%}
            {%- set b = (state_attr('sensor.deadline_cheap_blocks', 'blocks') if pacing == 'Cheapest hours'
                         else state_attr('sensor.deadline_pacing', 'slots') if pacing == 'Time slot'
                         else []) or [] -%}
            {%- if pacing in ['Cheapest hours', 'Time slot'] -%}
              {{ (b | first).start if b | count > 0 else '00:00:00' }}
            {%- else -%}
              {%- set s_raw = states('input_datetime.house_battery_deadline_start') -%}
              {{ s_raw if s_raw not in ['unknown', 'unavailable', 'none', ''] else '00:00:00' }}
            {%- endif -%}
          end: >-
            {%- set pacing = states('sensor.deadline_pacing') -%}
            {%- set b = (state_attr('sensor.deadline_cheap_blocks', 'blocks') if pacing == 'Cheapest hours'
                         else state_attr('sensor.deadline_pacing', 'slots') if pacing == 'Time slot'
                         else []) or [] -%}
            {%- if pacing in ['Cheapest hours', 'Time slot'] -%}
              {{ (b | last).end if b | count > 0 else '00:00:00' }}
            {%- else -%}
              {%- set s_raw = states('input_datetime.house_battery_deadline_start') -%}
              {%- set e_raw = states('input_datetime.house_battery_deadline_end') -%}
              {%- if s_raw in ['unknown', 'unavailable', 'none', ''] or e_raw in ['unknown', 'unavailable', 'none', ''] -%}
                00:00:00
              {%- else -%}
                {{ '23:59:59' if e_raw < s_raw else e_raw }}
              {%- endif -%}
            {%- endif -%}
          clamped: >-
            {%- set pacing = states('sensor.deadline_pacing') -%}
            {%- if pacing == 'Cheapest hours' -%}
              {#- as {{ false }}, not the bare word: HA literal-evals attributes and
                  'false' is not a Python literal, so it would arrive as a string. -#}
              {{ false }}
            {%- elif pacing == 'Time slot' -%}
              {{ state_attr('sensor.deadline_pacing', 'clamped') | default(false, true) }}
            {%- else -%}
              {%- set s_raw = states('input_datetime.house_battery_deadline_start') -%}
              {%- set e_raw = states('input_datetime.house_battery_deadline_end') -%}
              {{ s_raw not in ['unknown', 'unavailable', 'none', ''] and e_raw not in ['unknown', 'unavailable', 'none', ''] and e_raw < s_raw }}
            {%- endif -%}
          in_window: >-
            {%- set t = now().strftime('%H:%M:%S') -%}
            {%- set pacing = states('sensor.deadline_pacing') -%}
            {%- set b = (state_attr('sensor.deadline_cheap_blocks', 'blocks') if pacing == 'Cheapest hours'
                         else state_attr('sensor.deadline_pacing', 'slots') if pacing == 'Time slot'
                         else []) or [] -%}
            {%- if pacing in ['Cheapest hours', 'Time slot'] -%}
              {{ b | count > 0 and t >= (b | first).start and t < (b | last).end }}
            {%- else -%}
              {%- set s_raw = states('input_datetime.house_battery_deadline_start') -%}
              {%- set e_raw = states('input_datetime.house_battery_deadline_end') -%}
              {%- if s_raw in ['unknown', 'unavailable', 'none', ''] or e_raw in ['unknown', 'unavailable', 'none', ''] or s_raw == e_raw -%}
                {{ false }}
              {%- else -%}
                {%- set e_eff = '23:59:59' if e_raw < s_raw else e_raw -%}
                {{ t >= s_raw and t < e_eff }}
              {%- endif -%}
            {%- endif -%}
          # 0 OUTSIDE the window on purpose: the flow paces the energy on this number and
          # must not start spending it before the window opens.
          minutes_left: >-
            {%- set t = now().strftime('%H:%M:%S') -%}
            {%- set pacing = states('sensor.deadline_pacing') -%}
            {%- set b = (state_attr('sensor.deadline_cheap_blocks', 'blocks') if pacing == 'Cheapest hours'
                         else state_attr('sensor.deadline_pacing', 'slots') if pacing == 'Time slot'
                         else []) or [] -%}
            {%- if pacing in ['Cheapest hours', 'Time slot'] -%}
              {%- if b | count == 0 or t < (b | first).start or t >= (b | last).end -%}
                0
              {%- else -%}
                {{ [((as_timestamp(today_at((b | last).end)) - as_timestamp(now())) / 60) | round(0) | int, 0] | max }}
              {%- endif -%}
            {%- else -%}
              {%- set s_raw = states('input_datetime.house_battery_deadline_start') -%}
              {%- set e_raw = states('input_datetime.house_battery_deadline_end') -%}
              {%- if s_raw in ['unknown', 'unavailable', 'none', ''] or e_raw in ['unknown', 'unavailable', 'none', ''] or s_raw == e_raw -%}
                0
              {%- else -%}
                {%- set e_eff = '23:59:59' if e_raw < s_raw else e_raw -%}
                {%- if t < s_raw or t >= e_eff -%}
                  0
                {%- else -%}
                  {{ [((as_timestamp(today_at(e_eff)) - as_timestamp(now())) / 60) | round(0) | int, 0] | max }}
                {%- endif -%}
              {%- endif -%}
            {%- endif -%}
          # Minutes to the end of the window whether or not it has opened yet - this is the
          # number in the brackets on the card, "how long is left to the deadline".
          minutes_to_end: >-
            {%- set t = now().strftime('%H:%M:%S') -%}
            {%- set pacing = states('sensor.deadline_pacing') -%}
            {%- set b = (state_attr('sensor.deadline_cheap_blocks', 'blocks') if pacing == 'Cheapest hours'
                         else state_attr('sensor.deadline_pacing', 'slots') if pacing == 'Time slot'
                         else []) or [] -%}
            {%- if pacing in ['Cheapest hours', 'Time slot'] -%}
              {%- if b | count == 0 or t >= (b | last).end -%}
                0
              {%- else -%}
                {{ [((as_timestamp(today_at((b | last).end)) - as_timestamp(now())) / 60) | round(0) | int, 0] | max }}
              {%- endif -%}
            {%- else -%}
              {%- set s_raw = states('input_datetime.house_battery_deadline_start') -%}
              {%- set e_raw = states('input_datetime.house_battery_deadline_end') -%}
              {%- if s_raw in ['unknown', 'unavailable', 'none', ''] or e_raw in ['unknown', 'unavailable', 'none', ''] or s_raw == e_raw -%}
                0
              {%- else -%}
                {%- set e_eff = '23:59:59' if e_raw < s_raw else e_raw -%}
                {%- if t >= e_eff -%}
                  0
                {%- else -%}
                  {{ [((as_timestamp(today_at(e_eff)) - as_timestamp(now())) / 60) | round(0) | int, 0] | max }}
                {%- endif -%}
              {%- endif -%}
            {%- endif -%}

      # ---------------------------------------------------------------------------------------------
      # The two PLANNED windows, for the card that is shown while Charge Deadline is NOT
      # running. sensor.deadline_window only ever describes the route that is actually in
      # force (see sensor.deadline_pacing), so it cannot answer "when would Charge Deadline
      # run if I left the batteries to it" - these two can, one per dispatching strategy,
      # and they read the same source data the live window does.
      #
      # Both are pure display sensors: nothing in the Node-RED flow reads them.
      #
      # State = the NEXT block that can still be charged in, as "HH:MM - HH:MM (N min)" -
      # not the whole span from the first start to the last end. The span was misleading:
      # with two cheap blocks either side of an expensive afternoon it read as one long
      # window that does not exist, and it never shrank as blocks went by.
      #
      # The states, in this order:
      #   'Not defined'                     the route is not configured to dispatch
      #                                     Charge Deadline at all - nothing is planned,
      #                                     ever.
      #   'HH:MM - HH:MM (N min)'           the next block today, N being its own length.
      #   'Tomorrow HH:MM - HH:MM (N min)'  configured, but everything today is behind
      #                                     us - the first block of TOMORROW instead.
      #                                     Timed periods repeat daily, so that is simply
      #                                     the earliest configured slot at full length.
      #                                     The cheap route reads tomorrow's prices, so
      #                                     it can only roll over once they are published
      #                                     (around 13:00) and the source marks them low.
      #   'No cheap hours left today'       configured, everything behind us, and
      #                                     tomorrow's prices not in yet (cheap route
      #                                     only - Timed always knows tomorrow).
      #
      # A block already underway counts as the next one; its start reads as 'now' rather
      # than its original clock time, which is how the source data is already clipped.
      #
      # Attributes: configured, start, end, minutes (the next block), plus blocks_left
      # and minutes_total for the whole of the rest of the day. The attributes stay
      # TODAY-only on purpose - the Tomorrow rollover is display text for the card, and
      # anything reading the attributes wants "can I still charge today", not tomorrow.
      # ---------------------------------------------------------------------------------------------
      - name: "Deadline planned cheap window"
        unique_id: house_battery_deadline_planned_cheap_window
        icon: mdi:cash-clock
        # Gated on the Dynamic strategy's cheapest-period choice: the cheap blocks exist all
        # day regardless, but they are only a Charge Deadline window when Dynamic would
        # dispatch Charge Deadline into them. sensor.deadline_cheap_blocks already drops the
        # blocks that are over and clips one underway to 'now', so `blocks` IS what is left.
        state: >-
          {%- set on = states('input_select.house_battery_strategy_dynamic_cheapest') == 'Charge Deadline' -%}
          {%- set cb = state_attr('sensor.deadline_cheap_blocks', 'blocks') or [] -%}
          {%- if not on -%}
            Not defined
          {%- elif cb | count > 0 -%}
            {%- set b = cb | first -%}
            {{ b.start[:5] }} - {{ b.end[:5] }} ({{ b.minutes | round(0) | int }} min)
          {%- else -%}
            {#- Nothing left today: show tomorrow's FIRST cheap run instead, from the same
                source marks the blocks sensor reads. Adjacent low intervals are glued the
                same way (start == previous end); the list is sorted, so once adjacency
                breaks nothing later can extend the first run again. Tomorrow's prices
                arrive around 13:00 - before that there are no tomorrow marks and the
                state falls through to the old text. -#}
            {%- set tomorrow = (now() + timedelta(days=1)).strftime('%Y-%m-%d') -%}
            {%- set lows = (state_attr('sensor.hbc_energy_prices_data', 'marks') or [])
                  | selectattr('mark', 'eq', 'low')
                  | selectattr('start', 'defined') | rejectattr('start', 'none')
                  | selectattr('end', 'defined') | rejectattr('end', 'none')
                  | sort(attribute='start') | list -%}
            {%- set ns = namespace(s=none, e=none) -%}
            {%- for iv in lows -%}
              {%- if as_timestamp(iv.start, 0) > 0 and as_timestamp(iv.end, 0) > as_timestamp(iv.start, 0)
                     and (as_timestamp(iv.start, 0) | timestamp_custom('%Y-%m-%d', true)) == tomorrow -%}
                {%- if ns.s is none -%}
                  {%- set ns.s = iv.start -%}{%- set ns.e = iv.end -%}
                {%- elif iv.start == ns.e -%}
                  {%- set ns.e = iv.end -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {%- if ns.s is none -%}
              No cheap hours left today
            {%- else -%}
              Tomorrow {{ as_timestamp(ns.s) | timestamp_custom('%H:%M', true) }} - {{ as_timestamp(ns.e) | timestamp_custom('%H:%M', true) }} ({{ ((as_timestamp(ns.e) - as_timestamp(ns.s)) / 60) | round(0) | int }} min)
            {%- endif -%}
          {%- endif -%}
        attributes:
          # Every attribute follows the same gate as the state: when Dynamic is not set to
          # Charge Deadline there is no planned window, so reporting the cheap blocks here
          # would contradict a state of 'Not defined'.
          configured: >-
            {%- set cb = state_attr('sensor.deadline_cheap_blocks', 'blocks') or [] -%}
            {{ states('input_select.house_battery_strategy_dynamic_cheapest') == 'Charge Deadline'
               and cb | count > 0 }}
          start: >-
            {%- set on = states('input_select.house_battery_strategy_dynamic_cheapest') == 'Charge Deadline' -%}
            {%- set cb = state_attr('sensor.deadline_cheap_blocks', 'blocks') or [] -%}
            {{ (cb | first).start if on and cb | count > 0 else '' }}
          end: >-
            {%- set on = states('input_select.house_battery_strategy_dynamic_cheapest') == 'Charge Deadline' -%}
            {%- set cb = state_attr('sensor.deadline_cheap_blocks', 'blocks') or [] -%}
            {{ (cb | first).end if on and cb | count > 0 else '' }}
          minutes: >-
            {%- set on = states('input_select.house_battery_strategy_dynamic_cheapest') == 'Charge Deadline' -%}
            {%- set cb = state_attr('sensor.deadline_cheap_blocks', 'blocks') or [] -%}
            {{ (cb | first).minutes | round(0) | int if on and cb | count > 0 else 0 }}
          # The rest of the day, for anyone who wants the old whole-span figure back.
          blocks_left: >-
            {%- set on = states('input_select.house_battery_strategy_dynamic_cheapest') == 'Charge Deadline' -%}
            {{ (state_attr('sensor.deadline_cheap_blocks', 'blocks') or []) | count if on else 0 }}
          minutes_total: >-
            {%- set on = states('input_select.house_battery_strategy_dynamic_cheapest') == 'Charge Deadline' -%}
            {%- set cb = state_attr('sensor.deadline_cheap_blocks', 'blocks') or [] -%}
            {{ cb | map(attribute='minutes') | sum | round(0) | int if on else 0 }}

      - name: "Deadline planned timed window"
        unique_id: house_battery_deadline_planned_timed_window
        icon: mdi:calendar-clock
        # No gate on the master strategy: 'slots' is already only the Timed periods whose
        # strategy is Charge Deadline, so a non-empty list IS the definition of "exists".
        #
        # Unlike the cheap blocks, 'slots' is NOT clipped to now - it is the configured
        # period times, finished ones included - so the clipping happens here. Periods are
        # on the current day and HH:MM:SS strings compare correctly as strings, so a plain
        # comparison against the clock is enough; sensor.deadline_pacing has already
        # clamped an end at or before its start to 23:59:59.
        state: >-
          {%- set sl = state_attr('sensor.deadline_pacing', 'slots') or [] -%}
          {%- set t = now().strftime('%H:%M:%S') -%}
          {%- set left = sl | selectattr('end', 'gt', t) | list -%}
          {%- if sl | count == 0 -%}
            Not defined
          {%- elif left | count == 0 -%}
            {#- Every period is behind us. The periods repeat daily, so tomorrow's first
                window is simply the earliest configured slot ('slots' is merged in start
                order) at its full length - no clipping, tomorrow hasn't started yet. -#}
            {%- set s = sl | first -%}
            Tomorrow {{ s.start[:5] }} - {{ s.end[:5] }} ({{ s.minutes | round(0) | int }} min)
          {%- else -%}
            {%- set s = left | first -%}
            {%- set st = [s.start, t] | max -%}
            {{ st[:5] }} - {{ s.end[:5] }} ({{ ((as_timestamp(today_at(s.end)) - as_timestamp(today_at(st))) / 60) | round(0) | int }} min)
          {%- endif -%}
        attributes:
          configured: >-
            {{ (state_attr('sensor.deadline_pacing', 'slots') or []) | count > 0 }}
          start: >-
            {%- set t = now().strftime('%H:%M:%S') -%}
            {%- set left = (state_attr('sensor.deadline_pacing', 'slots') or [])
                  | selectattr('end', 'gt', t) | list -%}
            {{ [(left | first).start, t] | max if left | count > 0 else '' }}
          end: >-
            {%- set t = now().strftime('%H:%M:%S') -%}
            {%- set left = (state_attr('sensor.deadline_pacing', 'slots') or [])
                  | selectattr('end', 'gt', t) | list -%}
            {{ (left | first).end if left | count > 0 else '' }}
          minutes: >-
            {%- set t = now().strftime('%H:%M:%S') -%}
            {%- set left = (state_attr('sensor.deadline_pacing', 'slots') or [])
                  | selectattr('end', 'gt', t) | list -%}
            {%- if left | count > 0 -%}
              {%- set s = left | first -%}
              {{ ((as_timestamp(today_at(s.end)) - as_timestamp(today_at([s.start, t] | max))) / 60) | round(0) | int }}
            {%- else -%}
              0
            {%- endif -%}
          periods_left: >-
            {%- set t = now().strftime('%H:%M:%S') -%}
            {{ (state_attr('sensor.deadline_pacing', 'slots') or [])
               | selectattr('end', 'gt', t) | list | count }}
          minutes_total: >-
            {%- set t = now().strftime('%H:%M:%S') -%}
            {%- set ns = namespace(m=0) -%}
            {%- for s in (state_attr('sensor.deadline_pacing', 'slots') or []) -%}
              {%- if s.end > t -%}
                {%- set ns.m = ns.m + (as_timestamp(today_at(s.end)) - as_timestamp(today_at([s.start, t] | max))) / 60 -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.m | round(0) | int }}

      # ---------------------------------------------------------------------------------------------
      # Recorded twins of the Charge Deadline analytics.
      # Node-RED writes the input_number helpers (it can only set helpers), but helpers
      # carry no state_class and so produce NO long-term statistics - once the recorder
      # purge window passes, their history is gone entirely. These mirrors add
      # state_class: measurement, so HA keeps permanent hourly statistics. The helpers
      # themselves are excluded from the recorder in house_battery_control.yaml, so this
      # costs no extra rows. Point dashboards at these sensors, not the helpers.
      # Quantised to 10 W: at watt resolution these change on nearly every write and
      # each change is a recorder row, for a difference no one can see on a bar.
      # ---------------------------------------------------------------------------------------------
      - name: "Deadline required power"
        unique_id: house_battery_deadline_required_power_sensor
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:flash-outline
        availability: "{{ has_value('input_number.house_battery_deadline_required_power') }}"
        state: "{{ ((states('input_number.house_battery_deadline_required_power') | float(0)) / 10) | round(0) | int * 10 }}"

      - name: "Deadline PV power"
        unique_id: house_battery_deadline_pv_power_sensor
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:solar-power
        availability: "{{ has_value('input_number.house_battery_deadline_pv_power') }}"
        state: "{{ ((states('input_number.house_battery_deadline_pv_power') | float(0)) / 10) | round(0) | int * 10 }}"

      - name: "Deadline grid power"
        unique_id: house_battery_deadline_grid_power_sensor
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:transmission-tower-import
        availability: "{{ has_value('input_number.house_battery_deadline_grid_power') }}"
        state: "{{ ((states('input_number.house_battery_deadline_grid_power') | float(0)) / 10) | round(0) | int * 10 }}"

      - name: "Deadline shortage power"
        unique_id: house_battery_deadline_shortage_power_sensor
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:alert-outline
        availability: "{{ has_value('input_number.house_battery_deadline_shortage_power') }}"
        state: "{{ ((states('input_number.house_battery_deadline_shortage_power') | float(0)) / 10) | round(0) | int * 10 }}"

      # Formatted remaining time (H:MM) for the dashboard.
      # Deliberately plain: integer arithmetic and literal text only. No .format(),
      # no // or % operators, no availability template - so it always renders a string
      # and can never come out blank or unavailable. Falls back to 0:00 when the
      # source helper is missing, unknown or unavailable.
      - name: "Deadline goal progress"
        unique_id: house_battery_deadline_goal_progress
        icon: mdi:battery-heart-variant
        state: >-
          {%- set goal = states('input_select.house_battery_deadline_goal') -%}
          {%- if goal == 'energy reserve' -%}
            {%- set actual = states('input_number.house_battery_total_available_energy') | float(0) -%}
            {%- set target = states('input_number.house_battery_deadline_target_energy') | float(0) -%}
            {{ ('%.1f' % actual) | replace('.', ',') }} kWh (target {{ ('%.1f' % target) | replace('.', ',') }} kWh)
          {%- else -%}
            {%- set actual = states('sensor.hbc_battery_fleet_soc') | float(0) -%}
            {%- set target = 100 if goal == 'batteries are full' else states('input_number.house_battery_deadline_target_soc') | float(0) -%}
            {{ ('%.1f' % actual) | replace('.', ',') }} % (target {{ '%.0f' % target }} %)
          {%- endif -%}
        attributes:
          # Numeric progress towards the selected goal (%), for automations and gauges.
          progress_pct: >-
            {%- set goal = states('input_select.house_battery_deadline_goal') -%}
            {%- if goal == 'energy reserve' -%}
              {%- set actual = states('input_number.house_battery_total_available_energy') | float(0) -%}
              {%- set target = states('input_number.house_battery_deadline_target_energy') | float(0) -%}
            {%- else -%}
              {%- set actual = states('sensor.hbc_battery_fleet_soc') | float(0) -%}
              {%- set target = 100 if goal == 'batteries are full' else states('input_number.house_battery_deadline_target_soc') | float(0) -%}
            {%- endif -%}
            {{ 0 if target <= 0 else [(actual / target * 100), 100] | min | round(1) }}

      # Estimated clock time at which the target is reached, assuming the CURRENT
      # charge power is held from now on:
      #   hours_left = remaining_energy_kWh / (charge_power_W / 1000)
      #   ETA        = now + hours_left
      #
      # "Remaining energy" is written by Node-RED and already accounts for the
      # selected goal (target SoC, energy reserve, or batteries are full), so this
      # follows the goal automatically. Power is the same helper the dashboard shows
      # as "Current charge power" (positive = charging).
      # Plain text output, so it degrades to a readable message instead of going
      # unavailable when the batteries are idle or the target is already met.
      - name: "Deadline charged at"
        unique_id: house_battery_deadline_charged_at
        icon: mdi:clock-outline
        state: >-
          {%- set remaining = states('input_number.house_battery_deadline_remaining_energy') | float(0) -%}
          {%- set power = states('input_number.house_battery_total_battery_power') | float(0) -%}
          {%- if remaining <= 0.05 -%}
            Target reached
          {%- elif power <= 0 -%}
            Not charging
          {%- else -%}
            {%- set hours = remaining / (power / 1000) -%}
            {%- if hours > 48 -%}
              > 48 h
            {%- else -%}
              {%- set h = hours | int -%}
              {%- set m = ((hours - h) * 60) | round(0) | int -%}
              {{ (now() + timedelta(hours=h, minutes=m)).strftime('%H:%M') }} ({{ h }}:{{ '%02d' % m }})
            {%- endif -%}
          {%- endif -%}
        attributes:
          # Hours still needed at the current charge power (numeric, for automations)
          hours_to_target: >-
            {%- set remaining = states('input_number.house_battery_deadline_remaining_energy') | float(0) -%}
            {%- set power = states('input_number.house_battery_total_battery_power') | float(0) -%}
            {{ 0 if (remaining <= 0.05 or power <= 0) else (remaining / (power / 1000)) | round(2) }}
          # true when the estimated completion lands PAST the end of the window.
          #
          # Strictly two-valued, because the dashboard paints the clock from it: green at or
          # before the deadline, red after it. Nothing charging means nothing will finish, so
          # that counts as past the deadline; a target already reached counts as before it.
          # sensor.deadline_completion_indicator turns this into the 0/100 the icon colours from.
          #
          # Measured against minutes_to_end, NOT minutes_left: minutes_left is 0 until the
          # window opens (the flow paces on it and must not spend time it does not have yet),
          # and judging an ETA against 0 minutes makes every estimate late. Charging from PV
          # at 15:00 with a 22:00 deadline is early, not late.
          late: >-
            {%- set remaining = states('input_number.house_battery_deadline_remaining_energy') | float(0) -%}
            {%- set power = states('input_number.house_battery_total_battery_power') | float(0) -%}
            {%- set mins = state_attr('sensor.deadline_window', 'minutes_to_end') | float(0) -%}
            {%- if remaining <= 0.05 -%}
              {{ false }}
            {%- elif power <= 0 -%}
              {{ true }}
            {%- else -%}
              {{ (remaining / (power / 1000)) * 60 > mins }}
            {%- endif -%}

      # Extrapolated State of Charge at the deadline, assuming the CURRENT charge
      # power is held for the whole remaining window:
      #   SoC_deadline = SoC_now + (power_kW * hours_left) / usable_capacity_kWh * 100
      #
      # Compare it with the target SoC to see at a glance whether the current
      # charge speed is enough: below target means the deadline will be missed.
      # Power comes from the same helper the dashboard shows as "Current charge
      # power" (positive = charging, written by Node-RED). Capacity is summed from
      # the battery packs so it follows the fleet instead of a hard-coded number.
      # Clamped to 0..100 %.
      - name: "Deadline estimated SoC"
        unique_id: house_battery_deadline_estimated_soc
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        icon: mdi:battery-clock-outline
        availability: "{{ has_value('sensor.hbc_battery_fleet_soc') }}"
        state: >-
          {%- set cap_entities = [
            'sensor.marstek_m1_battery_total_energy',
            'sensor.marstek_m2_battery_total_energy',
            'sensor.marstek_m3_battery_total_energy',
            'sensor.marstek_m4_battery_total_energy',
            'sensor.marstek_m5_battery_total_energy',
            'sensor.marstek_m6_battery_total_energy',
          ] -%}
          {%- set capacity = expand(cap_entities)
            | selectattr('state', 'is_number')
            | map(attribute='state')
            | map('float', 0)
            | list
            | sum
          -%}
          {%- set soc = states('sensor.hbc_battery_fleet_soc') | float(0) -%}
          {%- if capacity <= 0 -%}
            {{ soc | round(0) | int }}
          {%- else -%}
            {%- set power = states('input_number.house_battery_total_battery_power') | float(0) -%}
            {%- set minutes = states('input_number.house_battery_deadline_remaining_minutes') | float(0) -%}
            {%- set minutes = 0 if minutes < 0 else minutes -%}
            {%- set added = (power / 1000) * (minutes / 60) / capacity * 100 -%}
            {#- Ceiling: the packs stop at their charging cutoff, not at 100 %.
                soc here is a fleet average, so the achievable maximum is the
                average of the per-battery cutoffs. Falls back to 100 if none read. -#}
            {%- set cut_entities = [
              'input_number.marstek_m1_charging_cutoff_capacity',
              'input_number.marstek_m2_charging_cutoff_capacity',
              'input_number.marstek_m3_charging_cutoff_capacity',
              'input_number.marstek_m4_charging_cutoff_capacity',
              'input_number.marstek_m5_charging_cutoff_capacity',
              'input_number.marstek_m6_charging_cutoff_capacity',
            ] -%}
            {%- set cutoffs = expand(cut_entities)
              | selectattr('state', 'is_number')
              | map(attribute='state')
              | map('float', 100)
              | list
            -%}
            {%- set ceiling = ((cutoffs | sum) / (cutoffs | count)) if (cutoffs | count) > 0 else 100 -%}
            {{ [[soc + added, ceiling] | min, 0] | max | round(0) | int }}
          {%- endif -%}

  # ---------------------------------------------------------------------------------------------
  # The colour carrier for the estimated completion row.
  #
  # An entities-card row cannot colour its value, but it does colour the ICON from the entity's
  # state when the card sets state_color: true. Which colour depends on the domain: for a
  # binary_sensor it comes from a per-device_class lookup that themes disagree about (a
  # `battery_charging` sensor renders amber, not green, in the default theme). For a SENSOR with
  # device_class: battery the colouring is level-based instead - green at the top of the range,
  # red at the bottom - which is the same mechanism that already paints
  # sensor.deadline_estimated_soc green, so it is known to work here.
  #
  # Hence a fake percentage: 100 when the estimate lands at or before the deadline, 0 when it
  # lands after. The row never shows this number - it shows the `eta` attribute - so the value
  # only has to be at the right end of the scale.
  #
  # sensor.deadline_charged_at's `late` attribute is the single source of truth for the split.
  # ---------------------------------------------------------------------------------------------
  - sensor:
      - name: "Deadline completion indicator"
        unique_id: house_battery_deadline_completion_indicator
        device_class: battery
        unit_of_measurement: "%"
        icon: mdi:clock-outline
        state: "{{ 0 if state_attr('sensor.deadline_charged_at', 'late') | bool(false) else 100 }}"
        attributes:
          eta: "{{ states('sensor.deadline_charged_at') }}"

  # ---------------------------------------------------------------------------------------------
  # "This deadline will be missed" — the one signal worth a phone notification.
  #
  # The test is deliberately hard: even at the packs' combined maximum charge power,
  # the energy still needed does not fit in the time still left. That makes it immune
  # to PID ramp-up and to the idle gaps that "Cheapest hours" pacing creates on purpose,
  # so an 'on' state always means something is actually wrong: too little time, a target
  # set too high, or a window that opened too late.
  #
  # 2 % headroom keeps it from tripping on rounding in the last minute.
  # ---------------------------------------------------------------------------------------------
  - binary_sensor:
      - name: "Deadline at risk"
        unique_id: house_battery_deadline_at_risk
        device_class: problem
        icon: mdi:calendar-alert
        state: >-
          {%- set active = states('input_text.house_battery_strategy_active_sub_strategy') == 'Charge Deadline' -%}
          {%- set need = states('input_number.house_battery_deadline_remaining_energy') | float(0) -%}
          {%- set mins = states('input_number.house_battery_deadline_remaining_minutes') | float(0) -%}
          {%- set pmax = states('input_number.house_battery_total_max_charge_power') | float(0) -%}
          {%- if not active or need <= 0.05 or mins <= 0 or pmax <= 0 -%}
            false
          {%- else -%}
            {{ need > (pmax / 1000) * (mins / 60) * 0.98 }}
          {%- endif -%}
        attributes:
          # How much of the target will be left unmet at full power, in kWh (0 when on track).
          deficit_kwh: >-
            {%- set need = states('input_number.house_battery_deadline_remaining_energy') | float(0) -%}
            {%- set mins = states('input_number.house_battery_deadline_remaining_minutes') | float(0) -%}
            {%- set pmax = states('input_number.house_battery_total_max_charge_power') | float(0) -%}
            {{ 0 if (need <= 0.05 or mins <= 0 or pmax <= 0)
               else [need - (pmax / 1000) * (mins / 60), 0] | max | round(2) }}